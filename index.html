/* ══ FIREBASE HOOK ══ */
function useFirestore(uid,col,init){
  const[v,sv]=useState(init);const[ready,setReady]=useState(false);const tmr=useRef(null);
  useEffect(()=>{if(!uid)return;const ref=db.collection('users').doc(uid).collection('datos').doc(col);
    const unsub=ref.onSnapshot(snap=>{if(snap.exists){const d=snap.data();sv(d.items||init);}else{sv(init);}setReady(true);},()=>setReady(true));
    return()=>unsub();},[uid,col]);
  const set=useCallback(x=>{const next=typeof x==='function'?x(v):x;sv(next);if(!uid)return;clearTimeout(tmr.current);tmr.current=setTimeout(()=>{db.collection('users').doc(uid).collection('datos').doc(col).set({items:next}).catch(console.error);},600);},[uid,col,v]);
  return[v,set,ready];
}

function AuthScreen(){
  const[codigo,setCodigo]=useState('');
  const[celular,setCelular]=useState('');
  const[email,setEmail]=useState('');
  const[negocio,setNegocio]=useState('');
  const[pinIngresado,setPinIngresado]=useState('');
  const[terminos,setTerminos]=useState(false);
  const[paso,setPaso]=useState(1);
  const[err,setErr]=useState('');
  const[carg,setCarg]=useState(false);

  const verificar=async()=>{
    const cod=codigo.trim().toUpperCase();
    if(!cod){setErr('Ingresá el código de activación');return;}
    setCarg(true);setErr('');
    try{
      const doc=await window.dbLicencias.collection('licencias').doc(cod).get();
      if(!doc.exists){setErr('Código inválido. Verificá con Emma Soluciones.');setCarg(false);return;}
      const d=doc.data();
      if(d.app&&d.app!=='emma-control'){setErr('Este código no es para Emma Control.');setCarg(false);return;}
      if(d.estado==='inactivo'){setErr('Licencia desactivada. Contactá al soporte.');setCarg(false);return;}
      if(d.estado==='usado'&&d.deviceId&&d.deviceId!==getDeviceIdEC()){setErr('Código ya usado en otro dispositivo.');setCarg(false);return;}
      setPaso(2);
    }catch(e){setErr('Error de conexión.');}
    setCarg(false);
  };

  const activar=async()=>{
    if(!negocio.trim()||!celular.trim()||!email.trim()||!pinIngresado.trim()){setErr('Completá todos los campos');return;}
    if(!terminos){setErr('Debés aceptar los Términos y Condiciones para continuar');return;}
    setCarg(true);setErr('');
    try{
      const cod=codigo.trim().toUpperCase();
      const deviceId=getDeviceIdEC();
      const snap=await window.dbLicencias.collection('licencias').doc(cod).get();
      const lic=snap.data();
      if(lic.email&&lic.email.trim().toLowerCase()!==email.trim().toLowerCase()){setErr('El email no coincide con el registrado. Contactá al administrador.');setCarg(false);return;}
      if(lic.celular&&lic.celular.trim()!==celular.trim()){setErr('El celular no coincide con el registrado. Contactá al administrador.');setCarg(false);return;}
      if(String(lic.pin)!==pinIngresado.trim()){setErr('El PIN no es correcto. Revisá el que te enviaron.');setCarg(false);return;}
      await window.dbLicencias.collection('licencias').doc(cod).update({estado:'usado',deviceId,celular:celular.trim(),email:email.trim(),negocio:negocio.trim(),aceptoTerminos:true,fechaAceptoTerminos:new Date().toISOString(),activadoEn:new Date().toISOString()});
      localStorage.setItem('ec_licencia',JSON.stringify({codigo:cod,pin:lic.pin,email:email.trim(),celular:celular.trim(),negocio:negocio.trim(),deviceId,activado:true}));
      window.location.reload();
    }catch(e){setErr('Error al activar.');}
    setCarg(false);
  };

  return<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'32px 24px',background:'var(--bg)',gap:16}}>
    <LogoSVG/>
    <div style={{fontFamily:'var(--fh)',fontSize:24,fontWeight:800,color:'var(--text)'}}>Emma Control</div>
    <div style={{fontSize:13,color:'var(--t2)'}}>Gestión financiera</div>
    {paso===1&&<>
      <p style={{fontSize:14,color:'var(--t2)',textAlign:'center',maxWidth:280,margin:0}}>Ingresá el código de activación que recibiste.</p>
      <input style={{...S.inp,textAlign:'center',fontSize:18,letterSpacing:3,textTransform:'uppercase',maxWidth:300,width:'100%'}} placeholder="EC-XXXXXX" value={codigo} onChange={e=>setCodigo(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&verificar()}/>
      {err&&<div style={{color:'#dc2626',fontSize:13}}>{err}</div>}
      <button style={{...S.btnP,maxWidth:200}} onClick={verificar} disabled={carg}>{carg?'Verificando...':'Continuar →'}</button>
    </>}
    {paso===2&&<>
      <p style={{fontSize:14,color:'#16a34a',textAlign:'center',maxWidth:280,margin:0}}>✓ Código válido. Completá tus datos.</p>
      <div style={{width:'100%',maxWidth:320,display:'flex',flexDirection:'column',gap:10}}>
        <div><label style={S.lbl}>Nombre del negocio *</label><input style={S.inp} placeholder="Ej: Mi Negocio" value={negocio} onChange={e=>setNegocio(e.target.value)}/></div>
        <div><label style={S.lbl}>Celular *</label><input style={S.inp} type="tel" placeholder="3816559001" value={celular} onChange={e=>setCelular(e.target.value)}/></div>
        <div><label style={S.lbl}>Email *</label><input style={S.inp} type="email" placeholder="tu@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
        <div><label style={S.lbl}>PIN de activación *</label><input style={S.inp} type="number" placeholder="PIN que recibiste con el código" value={pinIngresado} onChange={e=>setPinIngresado(e.target.value)}/></div>
      </div>
      <label style={{display:'flex',alignItems:'flex-start',gap:10,maxWidth:320,cursor:'pointer'}}>
        <input type="checkbox" checked={terminos} onChange={e=>setTerminos(e.target.checked)} style={{marginTop:3,width:18,height:18,flexShrink:0}}/>
        <span style={{fontSize:12,color:'var(--t2)',lineHeight:1.5}}>Acepto los <span style={{color:'var(--acc)',fontWeight:600}}>Términos y Condiciones</span> del servicio. La app se contrata mensualmente. El acceso se suspende si el pago no se realiza antes del día 11 de cada mes.</span>
      </label>
      {err&&<div style={{color:'#dc2626',fontSize:13}}>{err}</div>}
      <button style={{...S.btnP,maxWidth:200}} onClick={activar} disabled={carg}>{carg?'Activando...':'Activar →'}</button>
    </>}
  </div>;
}

        },200);

/* ══ CALENDARIO ══ */
function Calendario({movimientos}){
  const hoyStr=hoy();
  const[mes,setMes]=useState({y:new Date().getFullYear(),m:new Date().getMonth()});
  const[diaSelec,setDiaSelec]=useState(null);
  const{y,m}=mes;
  const movPorDia=useMemo(()=>{const r={};movimientos.forEach(mv=>{if(!mv.fecha)return;if(!r[mv.fecha])r[mv.fecha]=[];r[mv.fecha].push(mv);});return r;},[movimientos]);
  const primer=new Date(y,m,1).getDay();const offset=primer===0?6:primer-1;const dias=new Date(y,m+1,0).getDate();
  const celdas=[];for(let i=0;i<offset;i++)celdas.push(null);for(let d=1;d<=dias;d++)celdas.push(d);
  const cambiar=dir=>{let nm=m+dir,ny=y;if(nm>11){nm=0;ny++;}if(nm<0){nm=11;ny--;}setMes({y:ny,m:nm});setDiaSelec(null);};
  const selDia=d=>{const k=`${y}-${pad(m+1)}-${pad(d)}`;setDiaSelec(diaSelec===k?null:k);};
  const isHoy=d=>hoyStr===`${y}-${pad(m+1)}-${pad(d)}`;
  const movDia=diaSelec?movPorDia[diaSelec]||[]:[];
  const ingDia=movDia.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gastDia=movDia.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  return<div style={S.card}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <button onClick={()=>cambiar(-1)} style={{background:'none',border:'none',color:'var(--primary)',fontSize:20,cursor:'pointer',padding:'0 4px'}}>‹</button>
      <span style={{fontFamily:'var(--fh)',fontSize:13,fontWeight:700,color:'var(--text)'}}>{MESES_L[m]} {y}</span>
      <button onClick={()=>cambiar(1)} style={{background:'none',border:'none',color:'var(--primary)',fontSize:20,cursor:'pointer',padding:'0 4px'}}>›</button>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:4}}>
      {['Lu','Ma','Mi','Ju','Vi','Sa','Do'].map((d,i)=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:700,color:i>=5?'#dc2626':'var(--t3)',padding:'2px 0'}}>{d}</div>)}
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
      {celdas.map((d,i)=>{
        if(!d)return<div key={i}/>;
        const k=`${y}-${pad(m+1)}-${pad(d)}`;
        const tieneMovs=!!movPorDia[k];const selec=diaSelec===k;const esHoyD=isHoy(d);
        return<div key={i} onClick={()=>selDia(d)} style={{display:'flex',flexDirection:'column',alignItems:'center',cursor:'pointer',padding:'2px 0'}}>
          <div style={{width:30,height:30,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:esHoyD||selec?700:400,background:esHoyD?'var(--primary)':selec?'var(--pdim)':'transparent',color:esHoyD?'#fff':selec?'var(--primary)':'var(--text)',border:selec&&!esHoyD?'1.5px solid var(--primary)':'none'}}>{d}</div>
          {tieneMovs&&<div style={{width:4,height:4,borderRadius:'50%',background:esHoyD?'#fff':'var(--primary)',marginTop:1,opacity:0.7}}/>}
        </div>;
      })}
    </div>
    {diaSelec&&<div style={{marginTop:10,padding:'10px 12px',background:'var(--card2)',borderRadius:10,border:'0.5px solid var(--border)'}}>
      <div style={{fontSize:11,fontWeight:700,color:'var(--primary)',marginBottom:6}}>{fechaLarga(diaSelec)}</div>
      {movDia.length===0?<div style={{fontSize:12,color:'var(--t3)'}}>Sin movimientos registrados</div>:<>
        <div style={{display:'flex',gap:10,marginBottom:6}}>
          {ingDia>0&&<span style={{fontSize:11,color:'#16a34a',fontWeight:600}}>↑ {fmt(ingDia)}</span>}
          {gastDia>0&&<span style={{fontSize:11,color:'#dc2626',fontWeight:600}}>↓ {fmt(gastDia)}</span>}
        </div>
        {movDia.map(mv=><div key={mv.id} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',borderBottom:'0.5px solid var(--border)'}}>
          <span style={{color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'65%'}}>{mv.desc}</span>
          <span style={{fontWeight:600,color:mv.tipo==='ingreso'?'#16a34a':'#dc2626',flexShrink:0}}>{mv.tipo==='ingreso'?'+':'-'}{fmt(mv.monto)}</span>
        </div>)}
      </>}
    </div>}
  </div>;
}

    onClose();
  };
  const mn=Number(monto)||0;

/* ══ DASHBOARD ══ */
function Dashboard({movs,fijos,pagos,tarjetas,onNuevo,onVerIngresos,onVerEgresos,onVerArqueo}){
  const mesK=mk(hoy());
  const movMes=movs.filter(m=>mk(m.fecha)===mesK);
  const ingresos=movMes.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gastosVar=movMes.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  const cuotasMes=movs.filter(m=>m.tipo==='cuota'&&(m.venc||[]).some(v=>mk(v)===mesK));
  const totCuotas=cuotasMes.reduce((a,m)=>a+m.montoCuota,0);
  const pagosMes=(pagos||[]).filter(p=>p.mes===mesK);
  const totFijoPag=pagosMes.reduce((a,p)=>a+p.monto,0);
  const fijosPend=fijos.filter(f=>f.activo&&!pagosMes.find(p=>p.gastoFijoId===f.id));
  const totPend=fijosPend.reduce((a,f)=>a+f.monto,0);
  const totEgresos=gastosVar+totCuotas+totFijoPag;
  const balance=ingresos-totEgresos;
  const cb=balance>=0?'var(--success)':'var(--danger)';
  const anioActual=new Date().getFullYear().toString();
  const movAnio=movs.filter(m=>m.fecha&&m.fecha.startsWith(anioActual));
  const ingAnio=movAnio.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gasAnio=movAnio.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0)+movs.filter(m=>m.tipo==='cuota'&&(m.venc||[]).some(v=>v.startsWith(anioActual))).reduce((a,m)=>a+m.montoCuota*(m.venc||[]).filter(v=>v.startsWith(anioActual)).length,0);
  const balAnio=ingAnio-gasAnio;
  const venc=[];
  movs.filter(m=>m.tipo==='cuota').forEach(m=>(m.venc||[]).forEach((v,i)=>{const d=dh(v);if(d>=0&&d<=14)venc.push({label:`${m.desc} (${i+1}/${m.cuotas})`,monto:m.montoCuota,d,ico:'💳'});}));
  fijosPend.forEach(f=>{const[y,mo]=hoy().split('-');const fv=`${y}-${mo}-${pad(f.diaVenc)}`;const d=dh(fv);if(d>=-2&&d<=14)venc.push({label:f.nombre,monto:f.monto,d,ico:'📌'});});
  venc.sort((a,b)=>a.d-b.d);
  return<div style={S.scr}>
    <div style={{padding:'16px 18px 14px',background:'var(--card)',borderBottom:'0.5px solid var(--border)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
        <div>
          <div style={{fontFamily:'var(--fh)',fontSize:'0.6rem',color:'var(--t3)',fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:2}}>Emma Control</div>
          <div style={{fontFamily:'var(--fh)',fontSize:'1.05rem',fontWeight:800,color:'var(--text)'}}>{fechaLarga(hoy())}</div>
          <div style={{fontSize:'0.75rem',color:'var(--t2)',marginTop:1}}>{mlabel(mesK)}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:'0.6rem',color:'var(--t3)',marginBottom:1}}>Balance del mes</div>
          <div style={{fontFamily:'var(--fn)',fontSize:'1.15rem',fontWeight:700,color:cb,letterSpacing:'-0.02em'}}>{fmt(balance)}</div>
        </div>
      </div>
      <div onClick={onVerArqueo} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--pdim)',borderRadius:10,padding:'8px 12px',border:'0.5px solid var(--pborder)',cursor:'pointer'}}>
        <div>
          <div style={{fontSize:'0.6rem',color:'var(--primary)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:1}}>Acumulado {new Date().getFullYear()}</div>
          <div style={{fontFamily:'var(--fn)',fontSize:'1rem',fontWeight:700,color:balAnio>=0?'var(--success)':'var(--danger)',letterSpacing:'-0.02em'}}>{fmt(balAnio)}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div style={{fontSize:'0.6rem',color:'var(--t3)',marginBottom:2}}>↑{fmt(ingAnio)} ↓{fmt(gasAnio)}</div>
          <div style={{fontSize:'0.7rem',color:'var(--primary)',fontWeight:600}}>Ver arqueo →</div>
        </div>
      </div>
    </div>
    <div style={{padding:'14px 14px 0'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <div onClick={onVerIngresos} style={{...S.card2,cursor:'pointer',borderColor:'var(--sborder)',background:'#f0fdf4'}}>
          <div style={{fontSize:9,color:'#166534',fontWeight:700,marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>↑ Ingresos</div>
          <div style={{fontFamily:'var(--fn)',fontSize:17,fontWeight:700,color:'#16a34a',letterSpacing:'-0.02em'}}>{fmt(ingresos)}</div>
          <div style={{fontSize:10,color:'#4ade80',marginTop:3}}>Ver detalle →</div>
        </div>
        <div onClick={onVerEgresos} style={{...S.card2,cursor:'pointer',borderColor:'var(--dborder)',background:'#fef2f2'}}>
          <div style={{fontSize:9,color:'#991b1b',fontWeight:700,marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>↓ Egresos</div>
          <div style={{fontFamily:'var(--fn)',fontSize:17,fontWeight:700,color:'#dc2626',letterSpacing:'-0.02em'}}>{fmt(totEgresos)}</div>
          <div style={{fontSize:10,color:'#f87171',marginTop:3}}>Ver detalle →</div>
        </div>
      </div>
      {totPend>0&&<div style={{...S.card2,marginBottom:12,background:'#fffbeb',borderColor:'#fde68a',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:13,color:'#92400e',fontWeight:500}}>📌 Gastos fijos pendientes</span>
        <span style={{fontFamily:'var(--fn)',fontSize:15,fontWeight:700,color:'#d97706',letterSpacing:'-0.01em'}}>{fmt(totPend)}</span>
      </div>}
      <Calendario movimientos={movs}/>
      {venc.length>0&&<div style={{...S.card,marginTop:12}}>
        <div style={{...S.st,marginBottom:10}}>⚠️ Próximos vencimientos</div>
        {venc.slice(0,4).map((v,i)=><div key={i} style={{...S.row,borderBottom:i<Math.min(venc.length,4)-1?'0.5px solid #f0eeff':'none'}}>
          <div>
            <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{v.ico} {v.label}</div>
            <div style={{fontSize:11,color:v.d<=0?'#dc2626':v.d<=3?'#d97706':'var(--t2)',marginTop:1}}>{v.d<0?`Venció hace ${-v.d}d`:v.d===0?'¡Hoy!':v.d===1?'Mañana':`En ${v.d} días`}</div>
          </div>
          <div style={{fontWeight:700,fontSize:14,color:v.d<=3?'#dc2626':'var(--text)'}}>{fmt(v.monto)}</div>
        </div>)}
      </div>}
    </div>
    <FAB onClick={onNuevo}/>
  </div>;
}

/* ══ DETALLE INGRESOS ══ */
function DetalleIngresos({movs,onNuevo,onVolver,onEditar,onEliminar}){
  const mesK=mk(hoy());const[mes,setMes]=useState(mesK);
  const meses=useMemo(()=>{const s=new Set(movs.filter(m=>m.tipo==='ingreso').map(m=>mk(m.fecha)));s.add(mesK);return[...s].sort().reverse();},[movs]);
  const lista=movs.filter(m=>m.tipo==='ingreso'&&mk(m.fecha)===mes).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const total=lista.reduce((a,m)=>a+m.monto,0);
  const porCat=useMemo(()=>{const r={};lista.forEach(m=>{r[m.cat]=(r[m.cat]||0)+m.monto;});return Object.entries(r).sort((a,b)=>b[1]-a[1]);},[lista]);
  const icoMetodo={efectivo:'💵',tarjeta:'💳',débito:'💳',transferencia:'📲'};
  const porDia=useMemo(()=>{const r={};lista.forEach(m=>{if(!r[m.fecha])r[m.fecha]=[];r[m.fecha].push(m);});return r;},[lista]);
  const dias=useMemo(()=>Object.keys(porDia).sort((a,b)=>b.localeCompare(a)),[porDia]);
  return<div style={{...S.scr,WebkitOverflowScrolling:'touch'}} data-scroll="1">
    <div style={{padding:'14px 16px 12px',background:'var(--card)',borderBottom:'0.5px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
        <button onClick={onVolver} style={{background:'#ede9fe',border:'none',color:'var(--primary)',fontSize:18,cursor:'pointer',width:34,height:34,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center'}}>←</button>
        <span style={{fontFamily:'var(--fh)',fontSize:18,fontWeight:800,color:'var(--text)'}}>Ingresos</span>
      </div>
      <select value={mes} onChange={e=>setMes(e.target.value)} style={{...S.inp,fontSize:13,marginBottom:10}}>{meses.map(m=><option key={m} value={m}>{mlabel(m)}</option>)}</select>
      <div style={{background:'#f0fdf4',borderRadius:12,padding:'12px 14px',border:'0.5px solid #bbf7d0'}}>
        <div style={{fontSize:9,color:'#166534',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:3}}>Total del mes</div>
        <div style={{fontFamily:'var(--fn)',fontSize:26,fontWeight:700,color:'#16a34a',letterSpacing:'-0.02em'}}>{fmt(total)}</div>
        <div style={{fontSize:11,color:'#4ade80',marginTop:2}}>{lista.length} ingreso{lista.length!==1?'s':''}</div>
      </div>
    </div>
    <div style={{padding:'14px 14px 0'}}>
      {porCat.length>0&&<><div style={{...S.st,marginBottom:8}}>Por categoría</div><div style={{...S.card,marginBottom:12,padding:'10px 14px'}}>{porCat.map(([cat,v],i)=><div key={cat} style={{...S.row,borderBottom:i<porCat.length-1?'0.5px solid #f0eeff':'none'}}><div style={{display:'flex',alignItems:'center',gap:8}}><div style={{width:8,height:8,borderRadius:'50%',background:`hsl(${140+i*30},60%,40%)`,flexShrink:0}}/><span style={{fontSize:13,color:'var(--text)'}}>{cat}</span></div><div style={{textAlign:'right'}}><div style={{fontFamily:'var(--fn)',fontSize:13,fontWeight:700,color:'#16a34a'}}>{fmt(v)}</div>{total>0&&<div style={{fontSize:10,color:'var(--t3)'}}>{Math.round(v/total*100)}%</div>}</div></div>)}</div></>}
      <div style={{...S.st,marginBottom:4}}>Todos los ingresos</div>

/* ══ DETALLE EGRESOS ══ */

  const gastos=movs.filter(m=>m.tipo==='gasto'&&mk(m.fecha)===mes);
  const cuotas=movs.filter(m=>m.tipo==='cuota'&&(m.venc||[]).some(v=>mk(v)===mes));

  const total=lista.reduce((a,m)=>a+m.monto,0);

        <div style={{fontSize:9,color:'#991b1b',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:3}}>Total del mes</div>
        <div style={{fontFamily:'var(--fn)',fontSize:26,fontWeight:700,color:'#dc2626',letterSpacing:'-0.02em'}}>{fmt(total)}</div>
        <div style={{display:'flex',gap:14,marginTop:4}}><span style={{fontSize:11,color:'#991b1b'}}>Personal <b>{fmt(totP)}</b></span><span style={{fontSize:11,color:'#991b1b'}}>Trabajo <b>{fmt(totN)}</b></span></div>
      </div>
      <div style={{display:'flex',gap:6}}>{[['todos','Todos'],['personal','Personal'],['negocio','Trabajo']].map(([v,l])=><button key={v} onClick={()=>setFiltEnt(v)} style={{flex:1,padding:'7px 0',borderRadius:20,fontSize:12,fontWeight:600,cursor:'pointer',border:`1px solid ${filtEnt===v?'var(--primary)':'var(--border)'}`,background:filtEnt===v?'var(--pdim)':'transparent',color:filtEnt===v?'var(--primary)':'var(--t2)'}}>{l}</button>)}</div>

/* ══ TARJETAS ══ */

  const cxT=useMemo(()=>{const r={};movs.filter(m=>m.tipo==='cuota').forEach(m=>{if(!r[m.tarjetaId])r[m.tarjetaId]=[];const i=(m.venc||[]).findIndex(v=>mk(v)===mes);if(i>=0)r[m.tarjetaId].push({...m,ca:i+1});});return r;},[movs,mes]);

/* ══ GASTOS FIJOS ══ */
function GastosFijos({fijos,pagos,setPagos,onAgregar,onEditar,onEliminar}){
  const mes=mk(hoy());const[filtro,setFiltro]=useState('todos');
  const pagMes=(pagos||[]).filter(p=>p.mes===mes);
  const totF=fijos.filter(f=>f.activo).reduce((a,f)=>a+f.monto,0);
  const totP=pagMes.reduce((a,p)=>a+p.monto,0);
  const totPend=fijos.filter(f=>f.activo&&!pagMes.find(p=>p.gastoFijoId===f.id)).reduce((a,f)=>a+f.monto,0);
  const toggle=f=>{const ya=pagMes.find(p=>p.gastoFijoId===f.id);if(ya)setPagos(prev=>(prev||[]).filter(p=>!(p.gastoFijoId===f.id&&p.mes===mes)));else setPagos(prev=>[...(prev||[]),{id:uid2(),gastoFijoId:f.id,mes,monto:f.monto,fecha:hoy()}]);};
  const lista=fijos.filter(f=>filtro==='todos'||f.entidad===filtro);
  const getD=f=>{const[y,mo]=hoy().split('-');return dh(`${y}-${mo}-${pad(f.diaVenc)}`);};
  const bc=(f,pag)=>{if(pag)return'var(--primary)';const d=getD(f);return d<=0?'#dc2626':d<=5?'#d97706':'var(--border)';};
  return<div style={S.scr}>
    <div style={{padding:'14px 16px 12px',background:'var(--card)',borderBottom:'0.5px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>

      {lista.length===0&&<div style={{textAlign:'center',padding:'30px 0',color:'var(--t3)',fontSize:14}}>Sin gastos fijos</div>}

/* ══ ARQUEO ══ */
function Arqueo({movs,onVolver}){
  const anio=new Date().getFullYear();
  const[efectivoReal,setEfectivoReal]=useState('');const[mostrarRes,setMostrarRes]=useState(false);
  const movAnio=movs.filter(m=>m.fecha&&m.fecha.startsWith(anio));
  const ingAnio=movAnio.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+m.monto,0);
  const gasAnio=movAnio.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+m.monto,0);
  const cuotasAnio=movs.filter(m=>m.tipo==='cuota'&&(m.venc||[]).some(v=>v.startsWith(anio)));
  const totCuotas=cuotasAnio.reduce((a,m)=>a+m.montoCuota*(m.venc||[]).filter(v=>v.startsWith(anio)).length,0);
  const balanceAnio=ingAnio-gasAnio-totCuotas;
  const meses={};
  movAnio.forEach(m=>{const mes=m.fecha.slice(0,7);if(!meses[mes])meses[mes]={ing:0,gas:0};if(m.tipo==='ingreso')meses[mes].ing+=m.monto;else meses[mes].gas+=m.monto;});
  const diferencia=efectivoReal?Number(efectivoReal)-balanceAnio:null;
  return<div style={S.scr}>
    <div style={{padding:'14px 16px 12px',background:'var(--card)',borderBottom:'0.5px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
        <button onClick={onVolver} style={{background:'var(--pdim)',border:'none',color:'var(--primary)',fontSize:'1.1rem',cursor:'pointer',width:34,height:34,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center'}}>←</button>
        <span style={{fontFamily:'var(--fh)',fontSize:'1.1rem',fontWeight:800,color:'var(--text)'}}>Arqueo {anio}</span>
      </div>
    </div>
    <div style={{padding:'14px 14px 0'}}>
      <div style={{...S.card,marginBottom:12,background:'var(--pdim)',borderColor:'var(--pborder)'}}>
        <div style={{fontSize:'0.65rem',color:'var(--primary)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:8}}>Balance acumulado {anio}</div>
        <div style={{fontFamily:'var(--fh)',fontSize:'1.7rem',fontWeight:800,color:balanceAnio>=0?'var(--success)':'var(--danger)',marginBottom:10}}>{fmt(balanceAnio)}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div style={{background:'var(--card)',borderRadius:10,padding:'8px 10px',border:'0.5px solid var(--sborder)'}}><div style={{fontSize:'0.65rem',color:'var(--success)',fontWeight:700,marginBottom:2}}>↑ INGRESOS</div><div style={{fontFamily:'var(--fh)',fontSize:'0.95rem',fontWeight:800,color:'var(--success)'}}>{fmt(ingAnio)}</div></div>
          <div style={{background:'var(--card)',borderRadius:10,padding:'8px 10px',border:'0.5px solid var(--dborder)'}}><div style={{fontSize:'0.65rem',color:'var(--danger)',fontWeight:700,marginBottom:2}}>↓ EGRESOS</div><div style={{fontFamily:'var(--fh)',fontSize:'0.95rem',fontWeight:800,color:'var(--danger)'}}>{fmt(gasAnio+totCuotas)}</div></div>
        </div>
      </div>
      <div style={{...S.card,marginBottom:12}}>
        <div style={{...S.st,marginBottom:10}}>Mes a mes</div>
        {Object.entries(meses).sort().map(([mes,v],i,arr)=>{const bal=v.ing-v.gas;return<div key={mes} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 0',borderBottom:i<arr.length-1?'0.5px solid var(--border)':'none'}}><span style={{fontSize:'0.8rem',color:'var(--text)',fontWeight:500}}>{['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][+mes.slice(5)-1]} {mes.slice(0,4)}</span><div style={{textAlign:'right'}}><div style={{fontSize:'0.8rem',fontWeight:700,color:bal>=0?'var(--success)':'var(--danger)'}}>{fmt(bal)}</div><div style={{fontSize:'0.65rem',color:'var(--t3)'}}>{fmt(v.ing)} / {fmt(v.gas)}</div></div></div>;})}
      </div>
      <div style={{...S.card,marginBottom:12}}>
        <div style={{...S.st,marginBottom:10}}>🧾 Arqueo de caja</div>
        <div style={{fontSize:'0.8rem',color:'var(--t2)',marginBottom:10,lineHeight:1.5}}>Ingresá el dinero real que tenés en mano para comparar con lo registrado.</div>
        <label style={S.lbl}>Efectivo real $</label>
        <input style={{...S.inpR,marginBottom:10,fontSize:'1rem'}} type="number" inputMode="numeric" value={efectivoReal} onChange={e=>{setEfectivoReal(e.target.value);setMostrarRes(false);}} placeholder="0"/>
        <button style={S.btnP} onClick={()=>setMostrarRes(true)} disabled={!efectivoReal}>Calcular diferencia</button>
        {mostrarRes&&diferencia!==null&&<div style={{marginTop:12,padding:'14px',borderRadius:12,background:Math.abs(diferencia)<100?'var(--sdim)':diferencia>0?'var(--sdim)':'var(--ddim)',border:`0.5px solid ${Math.abs(diferencia)<100?'var(--sborder)':diferencia>0?'var(--sborder)':'var(--dborder)'}`}}>
          <div style={{fontSize:'0.7rem',fontWeight:700,color:diferencia>=0?'var(--success)':'var(--danger)',textTransform:'uppercase',marginBottom:4}}>{Math.abs(diferencia)<100?'✅ Cuadra perfecto':diferencia>0?'⬆️ Tenés de más':'⬇️ Falta dinero'}</div>
          <div style={{fontFamily:'var(--fh)',fontSize:'1.5rem',fontWeight:800,color:diferencia>=0?'var(--success)':'var(--danger)'}}>{diferencia>=0?'+':''}{fmt(diferencia)}</div>
          <div style={{fontSize:'0.75rem',color:'var(--t2)',marginTop:6}}>Registrado: {fmt(balanceAnio)} · Real: {fmt(Number(efectivoReal))}</div>
        </div>}
      </div>
    </div>
  </div>;
}

/* ══ MODAL INFORME ══════════════════════════════════════════════════════ */
function ModalInforme({movs, onClose}) {
  const [periodo, setPeriodo]   = React.useState('semana'); // dia | semana | mes
  const [filtro,  setFiltro]    = React.useState('todos');  // todos | ingreso | egreso
  const [detalles,setDetalles]  = React.useState(false);
  const [enviando,setEnviando]  = React.useState(false);

  const hoyDate = new Date();
  const hoyStr  = hoyDate.toISOString().slice(0,10);

  const getPeriodo = () => {
    if(periodo==='dia') {
      return {desde:hoyStr, hasta:hoyStr, label:'Hoy · '+hoyDate.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})};
    }
    if(periodo==='semana') {
      const lun=new Date(hoyDate); lun.setDate(hoyDate.getDate()-hoyDate.getDay()+1);
      const sab=new Date(lun); sab.setDate(lun.getDate()+6);
      return {desde:lun.toISOString().slice(0,10), hasta:sab.toISOString().slice(0,10),
        label:'Esta semana · '+lun.toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' al '+sab.toLocaleDateString('es-AR',{day:'numeric',month:'short'})};
    }
    // mes
    const d1=new Date(hoyDate.getFullYear(),hoyDate.getMonth(),1).toISOString().slice(0,10);
    const d2=new Date(hoyDate.getFullYear(),hoyDate.getMonth()+1,0).toISOString().slice(0,10);
    return {desde:d1, hasta:d2, label:hoyDate.toLocaleDateString('es-AR',{month:'long',year:'numeric'})};
  };

  const {desde, hasta, label} = getPeriodo();
  const movsFiltrados = (movs||[]).filter(m=>{
    if(!m.fecha||m.fecha<desde||m.fecha>hasta) return false;
    if(filtro==='ingreso') return m.tipo==='ingreso';
    if(filtro==='egreso')  return m.tipo==='gasto'||m.tipo==='egreso';
    return true;
  });

  const totalIng = movsFiltrados.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+(Number(m.monto)||0),0);
  const totalEgr = movsFiltrados.filter(m=>m.tipo!=='ingreso').reduce((a,m)=>a+(Number(m.monto)||0),0);
  const balance  = totalIng - totalEgr;
  const fmt = n => '$'+Math.round(Math.abs(Number(n)||0)).toLocaleString('es-AR');

  const enviar = async () => {
    const lic=(()=>{try{return JSON.parse(localStorage.getItem('ec_licencia')||'{}')}catch{return{}}})();
    if(!lic.email){alert('No hay email en tu licencia');return;}
    setEnviando(true);
    const fila=(l,v,c)=>`<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee;font-size:13px">${l}</td><td style="text-align:right;font-weight:600;color:${c||'#222'};border-bottom:1px solid #eee;font-size:13px">${v}</td></tr>`;
    const tipoStr = filtro==='ingreso'?'Solo ingresos':filtro==='egreso'?'Solo egresos':'Todos';
    
    let detHtml = '';
    if(detalles) {
      // Tabla detallada de movimientos
      detHtml = `<br><div style="font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Detalle de movimientos</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        ${movsFiltrados.sort((a,b)=>a.fecha>b.fecha?-1:1).map(m=>`
          <tr>
            <td style="padding:5px 0;border-bottom:1px solid #f0f0f0;color:#777">${m.fecha}</td>
            <td style="padding:5px 0;border-bottom:1px solid #f0f0f0">${m.desc||''}<br><span style="font-size:10px;color:#999">${m.cat||''}</span></td>
            <td style="padding:5px 0;border-bottom:1px solid #f0f0f0;text-align:right;font-weight:600;color:${m.tipo==='ingreso'?'#16a34a':'#e05c5c'}">${m.tipo==='ingreso'?'+':'-'}${fmt(m.monto)}</td>
          </tr>`).join('')}
      </table>`;
    }

    const htmlContent = `
      <div style="font-family:sans-serif;max-width:520px;margin:0 auto;padding:24px;background:#f9fafb">
        <div style="background:#5b21b6;border-radius:12px 12px 0 0;padding:20px 24px">
          <h2 style="color:#fff;margin:0;font-size:18px">📊 Informe Emma Control</h2>
          <p style="color:rgba(255,255,255,.75);margin:4px 0 0;font-size:13px">${lic.negocio||''} · ${label}</p>
          <p style="color:rgba(255,255,255,.6);margin:2px 0 0;font-size:11px">${tipoStr} · ${movsFiltrados.length} movimientos</p>
        </div>
        <div style="background:#fff;border-radius:0 0 12px 12px;padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,.08)">
          <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:16px">
            ${filtro!=='egreso'?fila('💰 Ingresos',fmt(totalIng),'#16a34a'):''}
            ${filtro!=='ingreso'?fila('💸 Egresos',fmt(totalEgr),'#e05c5c'):''}
            ${filtro==='todos'?fila('<b>📊 Balance</b>','<b>'+(balance>=0?'+':'')+fmt(balance)+'</b>',balance>=0?'#16a34a':'#e05c5c'):''}
          </table>
          ${detHtml}
        </div>
        <p style="color:#aaa;font-size:11px;text-align:center;margin-top:16px">Emma Control · Emma Soluciones Digitales</p>
      </div>`;

    try {
      const res = await fetch("https://api.brevo.com/v3/smtp/email",{
        method:"POST",
        headers:{"Content-Type":"application/json","api-key":BREVO_KEY_APP},
        body:JSON.stringify({
          sender:{name:"Emma Control · Emma Soluciones",email:"carabajalponce1980@gmail.com"},
          to:[{email:lic.email,name:lic.negocio||lic.email}],
          subject:`📊 Emma Control · ${label} · Balance ${fmt(balance)}`,
          htmlContent
        })
      });
      alert(res.ok?'✅ Informe enviado a '+lic.email:'❌ No se pudo enviar');
    } catch(e) { alert('❌ Error: '+e.message); }
    setEnviando(false);
  };

  const S = {
    overlay:{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:999,display:'flex',alignItems:'center',justifyContent:'center',padding:16},
    modal:{background:'var(--card,#1a2535)',borderRadius:16,padding:24,width:'100%',maxWidth:400,maxHeight:'90vh',overflowY:'auto'},
    h:{fontSize:17,fontWeight:700,color:'var(--text,#e2eaf4)',marginBottom:16},
    label:{fontSize:11,color:'var(--t2,#7a9ab8)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:6,display:'block'},
    pill:(a)=>({padding:'7px 14px',borderRadius:20,border:'none',cursor:'pointer',fontSize:13,fontWeight:600,
      background:a?'#5b21b6':'var(--bg3,#253647)',color:a?'#fff':'var(--t2,#7a9ab8)'}),
    row:{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'},
    check:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginBottom:16},
    preview:{background:'var(--bg2,#1a2535)',borderRadius:10,padding:'12px 16px',marginBottom:16},
    prow:(c)=>({display:'flex',justifyContent:'space-between',fontSize:13,padding:'4px 0',color:c||'var(--text,#e2eaf4)',fontWeight:600}),
    btn:{width:'100%',padding:14,borderRadius:10,border:'none',background:'#5b21b6',color:'#fff',fontSize:15,fontWeight:700,cursor:'pointer',opacity:enviando?0.6:1},
    btnSec:{width:'100%',padding:11,borderRadius:10,border:'0.5px solid var(--border,rgba(255,255,255,.13))',background:'transparent',color:'var(--t2,#7a9ab8)',fontSize:14,cursor:'pointer',marginTop:8},
  };

  return (
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={S.modal}>
        <div style={S.h}>📊 Enviar informe por email</div>

        <label style={S.label}>Período</label>
        <div style={S.row}>
          {[['dia','Hoy'],['semana','Semana'],['mes','Mes']].map(([k,l])=>(
            <button key={k} style={S.pill(periodo===k)} onClick={()=>setPeriodo(k)}>{l}</button>
          ))}
        </div>

        <label style={S.label}>Mostrar</label>
        <div style={S.row}>
          {[['todos','Todos'],['ingreso','Solo ingresos'],['egreso','Solo egresos']].map(([k,l])=>(
            <button key={k} style={S.pill(filtro===k)} onClick={()=>setFiltro(k)}>{l}</button>
          ))}
        </div>

        <label style={{...S.check}} onClick={()=>setDetalles(d=>!d)}>
          <div style={{width:20,height:20,borderRadius:6,border:'2px solid #5b21b6',background:detalles?'#5b21b6':'transparent',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {detalles&&<span style={{color:'#fff',fontSize:13}}>✓</span>}
          </div>
          <span style={{fontSize:13,color:'var(--text,#e2eaf4)'}}>Incluir detalle de movimientos</span>
        </label>

        <div style={S.preview}>
          <div style={{fontSize:11,color:'var(--t2,#7a9ab8)',marginBottom:6}}>{label} · {movsFiltrados.length} movimientos</div>
          {(filtro==='todos'||filtro==='ingreso')&&<div style={S.prow('#4dd9a0')}>💰 Ingresos <span>{fmt(totalIng)}</span></div>}
          {(filtro==='todos'||filtro==='egreso')&&<div style={S.prow('#f07070')}>💸 Egresos <span>{fmt(totalEgr)}</span></div>}
          {filtro==='todos'&&<div style={S.prow(balance>=0?'#4dd9a0':'#f07070')}>📊 Balance <span>{balance>=0?'+':''}{fmt(balance)}</span></div>}
        </div>

        <button style={S.btn} onClick={enviar} disabled={enviando}>
          {enviando?'Enviando...':'📧 Enviar informe'}
        </button>
        <button style={S.btnSec} onClick={onClose}>Cancelar</button>
      </div>
    </div>
  );
}
/* ══ FIN MODAL INFORME ════════════════════════════════════════════════ */

function App(){
  const[dark,setDark]=useTema();
  const[esc,setEsc]=useEscala();
  const[pant,setPant]=useState('dashboard');
  const[mMov,setMMov]=useState(false);const[tipoMov,setTipoMov]=useState(null);
  const[mTarj,setMTarj]=useState(false);const[eTarj,setETarj]=useState(null);
  const[mFijo,setMFijo]=useState(false);const[eFijo,setEFijo]=useState(null);
  const[mEditMov,setMEditMov]=useState(false);const[movEdit,setMovEdit]=useState(null);

  const uid=getLicenciaEC()?.deviceId||'default';
  const integracion=useIntegracion(uid);

  // Sincronización con App de Reparto
  const[sincToken,setSincToken]=React.useState(()=>localStorage.getItem('ec_sinc_token')||'');
  const[sincImportando,setSincImportando]=React.useState(false);
  const[sincUltimaSync,setSincUltimaSync]=React.useState(()=>localStorage.getItem('ec_sinc_ultima')||'');
  const generarSincToken=()=>{const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const t=Array.from({length:8},()=>chars[Math.floor(Math.random()*chars.length)]).join('');setSincToken(t);localStorage.setItem('ec_sinc_token',t);};
  const resetSincToken=()=>{setSincToken('');localStorage.removeItem('ec_sinc_token');localStorage.removeItem('ec_sinc_ultima');};
  const importarDesdeReparto=async()=>{
    if(!sincToken||!window.db)return;setSincImportando(true);
    try{const snap=await window.db.collection('sinc_reparto').doc(sincToken).collection('movimientos').get();if(snap.empty){alert('No hay datos nuevos de la App de Reparto');setSincImportando(false);return;}let nuevos=0;snap.forEach(doc=>{const d=doc.data();if(!movs.find(m=>m.id===d.id)){setMovs(prev=>[...prev,{...d,origen:'reparto'}]);nuevos++;}});const ahora=new Date().toLocaleString('es-AR');setSincUltimaSync(ahora);localStorage.setItem('ec_sinc_ultima',ahora);alert(nuevos>0?'✅ '+nuevos+' movimiento(s) importado(s)':'No hay movimientos nuevos');}
    catch(e){alert('Error al importar: '+e.message);}
    setSincImportando(false);
  };

  const[movs,setMovs,rM]=useFirestore(uid,'movimientos',[]);
  const[tarj,setTarj,rT]=useFirestore(uid,'tarjetas',[]);
  const[fijos,setFijos,rF]=useFirestore(uid,'gastosFijos',FDEF);
  const[pagos,setPagos,rP]=useFirestore(uid,'pagosFijos',[]);

  const agrMov=m=>setMovs(p=>[...p,m]);
  const actualizarMov=m2=>setMovs(p=>p.map(m=>m.id===m2.id?m2:m));
  const delMov=id=>{if(window.confirm('¿Eliminar este movimiento?'))setMovs(p=>p.filter(m=>m.id!==id));};
  const saveTarj=t=>setTarj(p=>p.find(x=>x.id===t.id)?p.map(x=>x.id===t.id?t:x):[...p,t]);
  const delTarj=id=>{if(window.confirm('¿Eliminar tarjeta?'))setTarj(p=>p.filter(t=>t.id!==id));};
  const saveFijo=f=>setFijos(p=>p.find(x=>x.id===f.id)?p.map(x=>x.id===f.id?f:x):[...p,f]);
  const delFijo=id=>{if(window.confirm('¿Eliminar gasto fijo?'))setFijos(p=>p.filter(f=>f.id!==id));};
  const cerrarSesion=()=>{if(window.confirm('¿Cerrar sesión?')){localStorage.removeItem('ec_licencia');window.location.reload();}};
  const exportarDatos=()=>{const data={movs,tarj,fijos,pagos,exportado:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`emma-control-${hoy()}.json`;a.click();};
  
  const importarDatos=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const d=JSON.parse(ev.target.result);const uid=getLicenciaEC()?.deviceId;if(!uid){alert('Tenés que estar logueado');return;}const base=db.collection('users').doc(uid).collection('datos');await Promise.all([base.doc('movimientos').set({items:d.movs||[]}),base.doc('tarjetas').set({items:d.tarj||[]}),base.doc('gastosFijos').set({items:d.fijos||[]}),base.doc('pagosFijos').set({items:d.pagos||[]})]);alert('✅ Importados: '+((d.movs||[]).length)+' movimientos');}catch(err){alert('❌ Error: '+err.message);}};r.readAsText(f);};inp.click();};
  const limpiarDatos=async()=>{if(!window.confirm('¿Borrar TODOS los datos?'))return;if(!window.confirm('¿Estás seguro? No se puede deshacer.'))return;const uid=getLicenciaEC()?.deviceId;if(uid){const base=db.collection('users').doc(uid).collection('datos');await Promise.all([base.doc('movimientos').set({items:[]}),base.doc('tarjetas').set({items:[]}),base.doc('gastosFijos').set({items:FDEF}),base.doc('pagosFijos').set({items:[]})]);} setMovs([]);setTarj([]);setFijos(FDEF);setPagos([]);alert('✅ Datos borrados');};
  const abrirMov=(tipo)=>{setTipoMov(tipo||null);setMMov(true);};

  // ── PANTALLAS DE ESTADO ──
  if(!(rM&&rT&&rF&&rP))return<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16,background:'var(--bg)'}}><div className="spin" style={{fontSize:32}}>☁️</div><div style={{fontFamily:'var(--fh)',fontSize:16,color:'var(--t2)'}}>Sincronizando datos...</div></div>;

  const render=()=>{switch(pant){
    case'dashboard':return<Dashboard movs={movs} fijos={fijos} pagos={pagos} tarjetas={tarj} onNuevo={()=>abrirMov()} onVerIngresos={()=>setPant('ingresos')} onVerEgresos={()=>setPant('egresos')} onVerArqueo={()=>setPant('arqueo')}/>;
    case'ingresos':return<DetalleIngresos movs={movs} onNuevo={t=>{setTipoMov(t);setMMov(true);}} onVolver={()=>setPant('dashboard')} onEditar={m=>{setMovEdit(m);setMEditMov(true);}} onEliminar={delMov}/>;
    case'egresos':return<DetalleEgresos movs={movs} tarjetas={tarj} onNuevo={t=>{setTipoMov(t);setMMov(true);}} onVolver={()=>setPant('dashboard')} onEditar={m=>{setMovEdit(m);setMEditMov(true);}} onEliminar={delMov}/>;
    case'movimientos':return<Movimientos movs={movs} onNuevo={()=>abrirMov()} onEliminar={delMov} onEditar={m=>{setMovEdit(m);setMEditMov(true);}}/>;
    case'tarjetas':return<Tarjetas tarjetas={tarj} movs={movs} onAgregar={()=>{setETarj(null);setMTarj(true);}} onEditar={t=>{setETarj(t);setMTarj(true);}} onEliminar={delTarj}/>;
    case'fijos':return<GastosFijos fijos={fijos} pagos={pagos} setPagos={setPagos} onAgregar={()=>{setEFijo(null);setMFijo(true);}} onEditar={f=>{setEFijo(f);setMFijo(true);}} onEliminar={delFijo}/>;
    case'arqueo':return<Arqueo movs={movs} onVolver={()=>setPant('dashboard')}/>;
    case'config':return<Config user={getLicenciaEC()} onCerrarSesion={cerrarSesion} dark={dark} setDark={setDark} integracion={integracion} onExportar={exportarDatos} onImportar={importarDatos} onLimpiar={limpiarDatos} onInforme={()=>setShowInforme(true)} sincToken={sincToken} sincImportando={sincImportando} sincUltimaSync={sincUltimaSync} generarSincToken={generarSincToken} resetSincToken={resetSincToken} importarDesdeReparto={importarDesdeReparto}/>;
  }};

  const navPant=['dashboard','movimientos','tarjetas','fijos','config'];
  return<>
    {render()}
    {navPant.includes(pant)&&<Nav act={pant} go={setPant}/>}
    {navPant.includes(pant)&&<BtnEscala esc={esc} setEsc={setEsc}/>}
    {mMov&&<ModalMov tarjetas={tarj} onGuardar={agrMov} tipoInicial={tipoMov} onClose={()=>{setMMov(false);setTipoMov(null);}}/>
    {showInforme&&<ModalInforme movs={movs} onClose={()=>setShowInforme(false)}/>}}
    {mEditMov&&movEdit&&<ModalEditMov mov={movEdit} tarjetas={tarj} onGuardar={actualizarMov} onClose={()=>{setMEditMov(false);setMovEdit(null);}}/>}
    {mTarj&&<ModalTarj tarjeta={eTarj} onGuardar={saveTarj} onClose={()=>{setMTarj(false);setETarj(null);}}/>}
    {mFijo&&<ModalFijo fijo={eFijo} onGuardar={saveFijo} onClose={()=>{setMFijo(false);setEFijo(null);}}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<AppWrapper/>);
</script>
  <script>
  // ── SERVICE WORKER (PWA - funciona sin internet) ──────────────────
  const EC_SW = `
    const CACHE = 'ec-v1';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
    });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.match(e.request).then(cached => {
          const net = fetch(e.request).then(res => {
            if (res.ok) caches.open(CACHE).then(c => c.put(e.request, res.clone()));
            return res;
          }).catch(() => cached);
          return cached || net;
        })
      );
    });
  `;
  if ('serviceWorker' in navigator) {
    const blob = new Blob([EC_SW], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob));
  }
  </script>
